name: Release with GitHub Action

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      semverBump:
        description: 'Specify SemVer version you wish to bump (see: https://github.com/crate-ci/cargo-release/blob/master/docs/reference.md#bump-level)'
        required: true
        type: choice
        options:
        - custom
        - release
        - patch
        - minor
        - major
        - alpha
        - beta
        - rc
      semverVersion:
        description: 'Specify exact SemVer version (corresponds to [version] listed here: https://github.com/crate-ci/cargo-release/blob/master/docs/reference.md#bump-level). Works only when you have selected [custom] in previous dropdox.'
        default: ''
        required: false
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    if: ${{ !(inputs.semverBump == 'custom' && inputs.semverVersion == '') }}
    outputs:
      new_version: ${{ steps.determine_version.outputs.NEW_VERSION }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0
      - name: Use Rust version from rust-toolchain.toml
        run: rustup show
      - uses: cargo-bins/cargo-binstall@6ed12bbaae779f3fd3ba1477bc9a61a2535a3bb2 # main
      - name: Install dependencies
        run: cargo binstall cargo-release ripgrep -y
      - name: Determine new version number by dry-running `cargo-release`
        id: determine_version
        continue-on-error: true
        env:
          SEMVER_BUMP: ${{ inputs.semverBump }}
          SEMVER_VERSION: ${{ inputs.semverVersion }}
        run: |
          if [[ "$SEMVER_BUMP" == "custom" ]]
          then
            cargo release version -p cycles-ledger "$SEMVER_VERSION" &> cargo-release-output.txt
          else
            cargo release version -p cycles-ledger "$SEMVER_BUMP" &> cargo-release-output.txt
          fi
          cat cargo-release-output.txt
          NEW_VERSION=$(cat cargo-release-output.txt | rg "Upgrading .* from .* to (.*)" -r '$1' | tr -d ' ')
          echo "$NEW_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          rm cargo-release-output.txt
      - name: Switch to the release branch, and push it
        run: |
          BRANCH_NAME="release/cycles-ledger-v$NEW_VERSION"
          git checkout -b "$BRANCH_NAME"
          git push --set-upstream origin "$BRANCH_NAME"
      - name: Set up git config
        env:
          SENDER_ID: ${{ github.event.sender.id }}
          SENDER_LOGIN: ${{ github.event.sender.login }}
        run: |
          git config author.email "$SENDER_ID+$SENDER_LOGIN@users.noreply.github.com"
          git config author.name "$SENDER_LOGIN"
          git config committer.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config committer.name "GitHub Actions Bot"
          git config user.email "$SENDER_ID+$SENDER_LOGIN@users.noreply.github.com"
          git config user.name "$SENDER_LOGIN"
      - name: Execute `cargo-release`
        if: ${{ inputs.semverBump != 'custom' }}
        env:
          SEMVER_BUMP: ${{ inputs.semverBump }}
        run: cargo release -p cycles-ledger --execute --no-confirm "$SEMVER_BUMP"
      - name: Execute `cargo-release`
        if: ${{ inputs.semverBump == 'custom' }}
        env:
          SEMVER_VERSION: ${{ inputs.semverVersion }}
        run: cargo release -p cycles-ledger --execute --no-confirm "$SEMVER_VERSION"


  call-release-binaries-workflow:
    needs: create-release
    uses: ./.github/workflows/release.yml
    with:
      release_tag: cycles-ledger-v${{ needs.create-release.outputs.new_version }}

  create-release-pr:
    needs: [create-release, call-release-binaries-workflow]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - name: Open the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ needs.create-release.outputs.new_version }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          TAG="cycles-ledger-v$NEW_VERSION"
          HEAD="release/$TAG"
          TITLE="chore(release): cycles-ledger-v$NEW_VERSION"
          echo "PR created by this workflow: $SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID" >> BODY.md
          echo "Link to release: https://github.com/dfinity/cycles-ledger/releases/tag/$TAG" >> BODY.md
          gh pr create --base main --head "$HEAD" --title "$TITLE" --body-file BODY.md
